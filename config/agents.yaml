# sacty が推奨するエージェントの既定（PBI-134）。sacty を更新すると、ここのモデルも新しくなる。
# 利用者の ~/.sacty/config.yaml には agents を書かなくてよい。書いたときは、同じ名前のエージェントを項目ごとに上書きする
# （名前を足すこともできる）。認証と単価は、config.yaml の providers.codex・providers.claude に書く。
# モデルの単価が providers.<runtime>.available_models に無いエージェントは、使えない扱いにして画面で警告する。

# 工程を動かす AI の既定。上から順に、使えるもの（providers に接続先と単価がある）を選ぶ
default_agent:
  - codex_standard
  - claude_standard

# 段階のエージェント。claude_<段階>・codex_<段階>（段階は lite・entry・standard・advanced・ultimate）は、
# 工程の実行で、接頭辞を外した名前（lite など）のサブエージェントとして置く
agents:
  codex_lite:
    runtime: codex
    model: gpt-6-luna
    reasoning_effort: low
  codex_entry:
    runtime: codex
    model: gpt-6-luna
    reasoning_effort: high
  codex_standard:
    runtime: codex
    model: gpt-6.1-sol
    reasoning_effort: low
  codex_advanced:
    runtime: codex
    model: gpt-6.1-sol
    reasoning_effort: medium
  codex_ultimate:
    runtime: codex
    model: gpt-6.1-sol
    reasoning_effort: high

  claude_lite:
    runtime: claude-code
    model: claude-haiku-5-5
  claude_entry:
    runtime: claude-code
    model: claude-sonnet-5-5
    reasoning_effort: low
  claude_standard:
    runtime: claude-code
    model: claude-sonnet-5-5
    reasoning_effort: medium
  claude_advanced:
    runtime: claude-code
    model: claude-opus-5-5
    reasoning_effort: medium
  claude_ultimate:
    runtime: claude-code
    model: claude-opus-5-5
    reasoning_effort: high
