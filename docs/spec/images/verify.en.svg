<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 940" width="1040" height="940" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/verify.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">From implementation to awaiting approval</title>
  <desc id="desc">After the implementation step, sacty merges in the latest base branch (redoing the implementation if conflict markers remain), opens the implementation PR as a draft, and waits for its CI (with no changes it goes on without a PR); the goal guardian judges from the tests it runs and the PR's CI. On a pass sacty marks the PR ready, adds the label, and waits for approval. Three failures in a row pause the task, and a person can also move it to review.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M410 96 L410 130" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M410 250 L410 270" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M260 190 L224.9 186.1 Q215 185 215 195 L215 423 Q215 433 225 433 L260 433" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M410 374 L410 405" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M560 433 L640 433" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M410 461 L410 505" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M560 533 L640 533" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M560 603 L590 603 Q600 603 600 613 L600 687 Q600 697 610 697 L640 697" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M790 739 L790 785" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M940 697 L980 697 Q990 697 990 687 L990 68 Q990 58 980 58 L560 58" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M370 621 L370 635 Q370 645 360 645 L200 645 Q190 645 190 655 L190 670" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M450 621 L450 635 Q450 645 460 645 L460 645 Q470 645 470 655 L470 670" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M640 840 L360 840 Q350 840 350 830 L350 750 Q350 745 345 745 L340 745" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <path d="M190 780 L190 840" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="260" y="20" width="300" height="76" rx="10" class="card" style=""/>
  <svg x="276" y="34" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="312" y="52" class="title">Implementation step</text>
  <text x="276" y="80" class="sub">The agent implements</text>
  <rect x="260" y="130" width="300" height="120" rx="10" class="card" style=""/>
  <svg x="276" y="144" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 5 4 7.8 9.8 7.8"/></svg>
  <text x="312" y="162" class="title">Open a draft PR</text>
  <text x="276" y="190" class="sub">Merges in the base branch,</text>
  <text x="276" y="210" class="sub">sacty commits and pushes</text>
  <text x="276" y="230" class="sub">None if nothing changed</text>
  <rect x="260" y="270" width="300" height="104" rx="10" class="card" style=""/>
  <svg x="276" y="284" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--amber)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
  <text x="312" y="302" class="title">Wait for the PR's CI</text>
  <text x="276" y="330" class="sub">sacty reads it (up to 60 min)</text>
  <rect x="276" y="339" width="160.9" height="21" rx="5" class="pill"/>
  <text x="284" y="354" class="code">PullRequestCiFinished</text>
  <rect x="260" y="405" width="300" height="56" rx="10" class="card" style=""/>
  <svg x="276" y="420" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="312" y="438" class="title">Diff available?</text>
  <rect x="640" y="395" width="300" height="84" rx="10" class="card" style=""/>
  <svg x="656" y="409" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="692" y="427" class="title">Pause</text>
  <rect x="656" y="440" width="167.8" height="21" rx="5" class="pill"/>
  <text x="664" y="455" class="code">verify.diffUnavailable</text>
  <rect x="260" y="505" width="300" height="116" rx="10" class="card" style="stroke:var(--green);stroke-width:1.5"/>
  <svg x="276" y="519" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="312" y="537" class="title">Final review</text>
  <text x="276" y="565" class="sub">The goal guardian runs the tests</text>
  <text x="276" y="585" class="sub">here, and with the PR's CI</text>
  <text x="276" y="605" class="sub">judges each viewpoint</text>
  <rect x="640" y="505" width="300" height="108" rx="10" class="card" style=""/>
  <svg x="656" y="519" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="692" y="537" class="title">Pause</text>
  <rect x="656" y="550" width="160.9" height="21" rx="5" class="pill"/>
  <text x="664" y="565" class="code">verify.commandMissing</text>
  <text x="656" y="591" class="sub">Resume restarts the final review</text>
  <rect x="640" y="655" width="300" height="84" rx="10" class="card" style=""/>
  <svg x="656" y="669" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="692" y="687" class="title">Third failure in a row?</text>
  <rect x="656" y="700" width="147.1" height="21" rx="5" class="pill"/>
  <text x="664" y="715" class="code">MAX_VERIFY_ATTEMPTS</text>
  <rect x="640" y="785" width="300" height="110" rx="10" class="card" style=""/>
  <svg x="656" y="799" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="692" y="817" class="title">Pause</text>
  <rect x="656" y="830" width="98.8" height="21" rx="5" class="pill"/>
  <text x="664" y="845" class="code">verification</text>
  <text x="656" y="871" class="sub">A person can move it to review</text>
  <rect x="40" y="670" width="300" height="110" rx="10" class="card" style=""/>
  <svg x="56" y="684" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 5 4 7.8 9.8 7.8"/></svg>
  <text x="92" y="702" class="title">Move to review</text>
  <text x="56" y="730" class="sub">Mark ready and add the label</text>
  <rect x="56" y="739" width="154" height="21" rx="5" class="pill"/>
  <text x="64" y="754" class="code">PullRequestPublished</text>
  <rect x="360" y="670" width="220" height="110" rx="10" class="card" style=""/>
  <svg x="376" y="684" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="412" y="702" class="title">No PR</text>
  <text x="376" y="730" class="sub">Approved in the UI</text>
  <rect x="376" y="739" width="112.6" height="21" rx="5" class="pill"/>
  <text x="384" y="754" class="code">NoChangesFound</text>
  <rect x="40" y="840" width="300" height="76" rx="10" class="card" style=""/>
  <svg x="56" y="854" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="92" y="872" class="title">Implementation awaits approval</text>
  <text x="56" y="900" class="sub">Approved by merging the PR</text>
  <rect x="415" y="245" width="45.9" height="18" rx="4" class="label-bg"/>
  <text x="420" y="258" class="label" text-anchor="start">opened</text>
  <rect x="137.7" y="307" width="67.3" height="18" rx="4" class="label-bg"/>
  <text x="205" y="320" class="label" text-anchor="end">no changes</text>
  <rect x="589" y="412" width="22" height="18" rx="4" class="label-bg"/>
  <text x="600" y="425" class="label" text-anchor="middle">no</text>
  <rect x="415" y="475" width="27.9" height="18" rx="4" class="label-bg"/>
  <text x="420" y="488" class="label" text-anchor="start">yes</text>
  <rect x="576.6" y="514" width="46.8" height="18" rx="4" class="label-bg"/>
  <text x="600" y="527" class="label" text-anchor="middle">no tool</text>
  <rect x="603" y="642" width="28.9" height="18" rx="4" class="label-bg"/>
  <text x="608" y="655" class="label" text-anchor="start">fail</text>
  <rect x="793" y="752" width="51.9" height="18" rx="4" class="label-bg"/>
  <text x="798" y="765" class="label" text-anchor="start">reached</text>
  <rect x="733.2" y="39" width="83.6" height="18" rx="4" class="label-bg"/>
  <text x="775" y="52" class="label" text-anchor="middle">not yet (redo)</text>
  <rect x="263" y="626" width="33.9" height="18" rx="4" class="label-bg"/>
  <text x="280" y="639" class="label" text-anchor="middle">pass</text>
  <rect x="495" y="648" width="98.1" height="18" rx="4" class="label-bg"/>
  <text x="500" y="661" class="label" text-anchor="start">pass, no changes</text>
  <rect x="446" y="819" width="98.1" height="18" rx="4" class="label-bg"/>
  <text x="495" y="832" class="label" text-anchor="middle">a person decides</text>
</svg>
