<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/context-mcp.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">Where an MCP server runs</title>
  <desc id="desc">A server in mcp.yaml uses the host's gateway.mcp_servers entry of the same name if there is one. Otherwise via_gateway, whether a gateway exists, and the type decide: started on the host, relayed by the gateway, started in the container, or connected directly.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M520 76 L520 110" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M370 148 L320 154" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M520 186 L520 240" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M390 316 L390 340 Q390 350 380 350 L150 350 Q140 350 140 360 L140 380" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M480 316 L480 350 Q480 360 470 360 L405 360 Q395 360 395 370 L395 380" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M560 316 L560 350 Q560 360 570 360 L640 360 Q650 360 650 370 L650 380" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M650 316 L650 340 Q650 350 660 350 L892 350 Q902 350 902.2 360 L902.5 380" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="390" y="20" width="260" height="56" rx="10" class="card" style=""/>
  <svg x="406" y="35" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="442" y="53" class="title">A server in mcp.yaml</text>
  <rect x="370" y="110" width="300" height="76" rx="10" class="card" style=""/>
  <svg x="386" y="124" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="422" y="142" class="title">Same name exists?</text>
  <text x="386" y="170" class="strong">gateway.mcp_servers</text>
  <rect x="40" y="100" width="280" height="108" rx="10" class="card" style=""/>
  <svg x="56" y="114" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/></svg>
  <text x="92" y="132" class="title">Host MCP server</text>
  <text x="56" y="160" class="sub">Used, with a warning</text>
  <rect x="56" y="169" width="78.1" height="21" rx="5" class="pill"/>
  <text x="64" y="184" class="code">/mcp/name</text>
  <rect x="370" y="240" width="300" height="76" rx="10" class="card" style=""/>
  <svg x="386" y="254" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="422" y="272" class="title">Through the gateway?</text>
  <text x="386" y="300" class="sub">via_gateway: true and a gateway exists</text>
  <rect x="20" y="380" width="240" height="96" rx="10" class="card" style=""/>
  <svg x="36" y="394" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/></svg>
  <text x="72" y="412" class="title">Started on the host</text>
  <text x="36" y="440" class="sub">The gateway starts it</text>
  <text x="36" y="460" class="sub">Runs in a copy of the layer</text>
  <rect x="275" y="380" width="240" height="96" rx="10" class="card" style=""/>
  <svg x="291" y="394" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="327" y="412" class="title">Relayed by the gateway</text>
  <text x="291" y="440" class="sub">Header secrets are</text>
  <text x="291" y="460" class="sub">added on the host</text>
  <rect x="530" y="380" width="240" height="96" rx="10" class="card" style=""/>
  <svg x="546" y="394" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="582" y="412" class="title">Started in the container</text>
  <text x="546" y="440" class="sub">Secrets are passed as</text>
  <text x="546" y="460" class="sub">environment variables</text>
  <rect x="785" y="380" width="235" height="96" rx="10" class="card" style=""/>
  <svg x="801" y="394" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><path d="M9 2.5v4.5M15 2.5v4.5M6.5 7h11v3.5a5.5 5.5 0 0 1-11 0zM12 16v5.5"/></svg>
  <text x="837" y="412" class="title">Direct from container</text>
  <text x="801" y="440" class="sub">Connects to the URL</text>
  <text x="268" y="506" class="sub" text-anchor="middle">The agent gets only /ctx-mcp/name and the per-run token</text>
  <text x="775" y="506" class="sub" text-anchor="middle">Secret values enter the container</text>
  <rect x="331" y="129" width="27.9" height="18" rx="4" class="label-bg"/>
  <text x="345" y="142" class="label" text-anchor="middle">yes</text>
  <rect x="509" y="205" width="22" height="18" rx="4" class="label-bg"/>
  <text x="520" y="218" class="label" text-anchor="middle">no</text>
  <rect x="151.6" y="332" width="76.7" height="18" rx="4" class="label-bg"/>
  <text x="190" y="345" class="label" text-anchor="middle">yes, command</text>
  <rect x="366.9" y="359" width="56.2" height="18" rx="4" class="label-bg"/>
  <text x="395" y="372" class="label" text-anchor="middle">yes, URL</text>
  <rect x="614.6" y="359" width="70.7" height="18" rx="4" class="label-bg"/>
  <text x="650" y="372" class="label" text-anchor="middle">no, command</text>
  <rect x="824.9" y="332" width="50.3" height="18" rx="4" class="label-bg"/>
  <text x="850" y="345" class="label" text-anchor="middle">no, URL</text>
</svg>
