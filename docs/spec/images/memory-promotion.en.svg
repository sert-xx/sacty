<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/memory-promotion.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">Promoting memories</title>
  <desc id="desc">The overview audit moves misplaced memories between tiers and proposes turning frequently useful memories into context. When the adopted improvement PR is merged, the original memory is deleted.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M250 208 C280 208 280 92 310 92" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M250 208 C280 208 280 282 310 282" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M580 292 L620 292" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M715 264 L715 208 Q715 198 725 198 L840 198" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M930 246 L935 300" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M715 320 L715 360" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="160" width="230" height="96" rx="10" class="card" style=""/>
  <svg x="36" y="174" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="72" y="192" class="title">Overview audit</text>
  <text x="36" y="220" class="sub">Input: undeleted memories</text>
  <text x="36" y="240" class="sub">and their useful counts</text>
  <rect x="310" y="30" width="270" height="104" rx="10" class="card" style=""/>
  <svg x="326" y="44" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7"/><path d="M18 2.5v4h-4M6 21.5v-4h4"/></svg>
  <text x="362" y="62" class="title">Move between tiers</text>
  <rect x="326" y="75" width="160.9" height="21" rx="5" class="pill"/>
  <text x="334" y="90" class="code">memoryMoves (up to 3)</text>
  <text x="326" y="116" class="sub">project ↔ repository</text>
  <rect x="310" y="240" width="270" height="104" rx="10" class="card" style=""/>
  <svg x="326" y="254" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.8 1.2.8 1.9v1.8h6v-1.8c0-.7.3-1.4.8-1.9A6.5 6.5 0 0 0 12 2.5z"/></svg>
  <text x="362" y="272" class="title">Proposal to make it context</text>
  <rect x="326" y="285" width="195.4" height="21" rx="5" class="pill"/>
  <text x="334" y="300" class="code">memoryPromotions (up to 2)</text>
  <text x="326" y="326" class="sub">Roughly: useful twice or more</text>
  <rect x="620" y="264" width="190" height="56" rx="10" class="card" style=""/>
  <svg x="636" y="279" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="672" y="297" class="title">A person decides</text>
  <rect x="840" y="150" width="180" height="96" rx="10" class="card" style=""/>
  <svg x="856" y="164" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="892" y="182" class="title">Improvement task</text>
  <text x="856" y="210" class="sub">In the target repo</text>
  <text x="856" y="230" class="sub">Runs to a PR</text>
  <rect x="850" y="300" width="170" height="84" rx="10" class="card" style=""/>
  <svg x="866" y="314" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
  <text x="902" y="332" class="title">Delete original</text>
  <rect x="866" y="345" width="71.2" height="21" rx="5" class="pill"/>
  <text x="874" y="360" class="code">promoted</text>
  <rect x="600" y="360" width="230" height="76" rx="10" class="card" style=""/>
  <svg x="616" y="374" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="M5 21.5V3.5M5 4h12l-2.5 4L17 12H5"/></svg>
  <text x="652" y="392" class="title">Keep the memory</text>
  <text x="616" y="420" class="sub">Reason goes to the next audit</text>
  <rect x="750.1" y="179" width="39.9" height="18" rx="4" class="label-bg"/>
  <text x="770" y="192" class="label" text-anchor="middle">adopt</text>
  <rect x="938" y="265" width="63.6" height="18" rx="4" class="label-bg"/>
  <text x="943" y="278" class="label" text-anchor="start">PR merged</text>
  <rect x="718" y="331" width="43.4" height="18" rx="4" class="label-bg"/>
  <text x="723" y="344" class="label" text-anchor="start">reject</text>
</svg>
