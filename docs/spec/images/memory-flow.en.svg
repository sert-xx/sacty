<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" width="1040" height="340" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/memory-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">From registering a memory to reading it</title>
  <desc id="desc">Memories registered by an audit deep dive and their deletions are recorded in the activity log, and the daemon rewrites the project and repository tier files. Step agents open only the relevant ones from the read-only index.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M240 82 C265 82 265 151 290 151" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M240 259 C265 259 265 175 290 175" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M480 163 C510 163 510 90 540 90" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M480 163 C510 163 510 250 540 250" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M820 90 C844 90 838 154 862 154" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M820 250 C844 250 838 182 862 182" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="40" width="220" height="84" rx="10" class="card" style=""/>
  <svg x="36" y="54" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="72" y="72" class="title">Audit deep dive</text>
  <rect x="36" y="85" width="112.6" height="21" rx="5" class="pill"/>
  <text x="44" y="100" class="code">AuditDeepDived</text>
  <rect x="20" y="196" width="220" height="126" rx="10" class="card" style=""/>
  <svg x="36" y="210" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
  <text x="72" y="228" class="title">Deletion</text>
  <rect x="36" y="241" width="140.2" height="21" rx="5" class="pill"/>
  <text x="44" y="256" class="code">AuditMemoryDeleted</text>
  <text x="36" y="282" class="sub">person, capacity,</text>
  <text x="36" y="302" class="sub">expiry, promotion</text>
  <rect x="290" y="125" width="190" height="76" rx="10" class="card" style="stroke:var(--green);stroke-width:1.5"/>
  <svg x="306" y="139" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
  <text x="342" y="157" class="title">Activity log</text>
  <text x="306" y="185" class="sub">Source of truth</text>
  <rect x="540" y="20" width="280" height="140" rx="10" class="card" style=""/>
  <svg x="556" y="34" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="592" y="52" class="title">Project tier</text>
  <rect x="556" y="65" width="147.1" height="21" rx="5" class="pill"/>
  <text x="564" y="80" class="code">memory/projects/ID/</text>
  <text x="556" y="106" class="sub">SKILL.md (index), references/</text>
  <rect x="556" y="115" width="160.9" height="21" rx="5" class="pill"/>
  <text x="564" y="130" class="code">/sacty-memory/project</text>
  <rect x="540" y="180" width="280" height="140" rx="10" class="card" style=""/>
  <svg x="556" y="194" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="592" y="212" class="title">Repository tier</text>
  <rect x="556" y="225" width="216.1" height="21" rx="5" class="pill"/>
  <text x="564" y="240" class="code">memory/repos/host/owner/name/</text>
  <text x="556" y="266" class="sub">SKILL.md (index), references/</text>
  <rect x="556" y="275" width="181.6" height="21" rx="5" class="pill"/>
  <text x="564" y="290" class="code">/sacty-memory/repository</text>
  <rect x="862" y="104" width="158" height="128" rx="10" class="card" style=""/>
  <svg x="878" y="118" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="914" y="136" class="title">Step</text>
  <text x="914" y="155" class="title">agent</text>
  <text x="878" y="183" class="sub">Opens only the</text>
  <text x="878" y="203" class="sub">relevant ones</text>
  <rect x="482.3" y="107" width="55.3" height="18" rx="4" class="label-bg"/>
  <text x="510" y="120" class="label" text-anchor="middle">rewrites</text>
  <rect x="482.3" y="209" width="55.3" height="18" rx="4" class="label-bg"/>
  <text x="510" y="222" class="label" text-anchor="middle">rewrites</text>
  <text x="941" y="256" class="label" text-anchor="middle">Mounted read only</text>
</svg>
