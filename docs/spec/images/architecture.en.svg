  <svg x="196" y="98" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/></svg>
  <text x="232" y="116" class="title">sacty up</text>
  <text x="196" y="144" class="sub">packages/cli</text>
  <rect x="180" y="210" width="200" height="96" rx="10" class="card" style=""/>
  <svg x="196" y="224" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 8.5h19M6 6.3h.01M8.5 6.3h.01"/></svg>
