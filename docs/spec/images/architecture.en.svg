  <path d="M380 122 C405 122 405 132 430 132" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <path d="M380 248 C405 248 405 156 430 156" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M760 142 C797.5 142 797.5 132 835 132" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M835 182 C797.5 182 797.5 234 760 234" class="flow" style="" marker-end="url(#ah-arrow)"/>
