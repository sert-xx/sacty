  <rect x="430" y="196" width="330" height="76" rx="10" class="card" style=""/>
  <svg x="446" y="210" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="482" y="228" class="title">Gateway</text>
  <text x="446" y="256" class="sub">Relays AI, PF, GitHub, and MCP</text>
  <rect x="430" y="288" width="330" height="56" rx="10" class="card" style=""/>
  <svg x="446" y="303" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
  <text x="482" y="321" class="title">SACTY_HOME/sacty.db</text>
  <rect x="835" y="104" width="170" height="96" rx="10" class="card" style=""/>
  <svg x="851" y="118" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
