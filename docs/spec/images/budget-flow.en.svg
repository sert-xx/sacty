<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" width="1040" height="410" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/budget-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">Budget cap and pausing</title>
  <desc id="desc">A task's budget cap is budget.default_per_task_usd at creation; when steps are chosen, it becomes the plan's budget in budget.per_plan_usd if there is one (unless a person raised the cap). Run costs are added to the amount used, and BudgetWarned is recorded at 80% (the notice is reset when choosing steps changes the cap). At the cap, the task pauses before choosing steps, running a step (except opening the PR for a verified implementation), or verifying; when a person sets a new cumulative cap and resumes, it continues from where it stopped.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M260 105 C284 105 276 105 300 105" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M550 105 C574 105 566 105 590 105" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M810 105 C834 105 826 105 850 105" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M740 170 L740 240" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M590 315 C566 315 574 315 550 315" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M300 315 C276 315 284 315 260 315" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M140 240 L140 215 Q140 205 150 205 L640 205 Q650 205 650 195 L650 170" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="40" width="240" height="130" rx="10" class="card" style=""/>
  <svg x="36" y="54" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M5 21.5V3.5M5 4h12l-2.5 4L17 12H5"/></svg>
  <text x="72" y="72" class="title">Creation</text>
  <rect x="36" y="85" width="91.9" height="21" rx="5" class="pill"/>
  <text x="44" y="100" class="code">TaskCreated</text>
  <rect x="36" y="111" width="202.3" height="21" rx="5" class="pill"/>
  <text x="44" y="126" class="code">budget.default_per_task_usd</text>
  <rect x="300" y="40" width="250" height="130" rx="10" class="card" style=""/>
  <svg x="316" y="54" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>
  <text x="352" y="72" class="title">Choosing steps</text>
  <text x="316" y="100" class="sub">If the plan has a budget</text>
  <rect x="316" y="109" width="147.1" height="21" rx="5" class="pill"/>
  <text x="324" y="124" class="code">budget.per_plan_usd</text>
  <text x="316" y="150" class="sub">Keeps a cap a person raised</text>
  <rect x="590" y="40" width="220" height="130" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="606" y="54" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/></svg>
  <text x="642" y="72" class="title">Runs</text>
  <text x="606" y="100" class="sub">Adds costs to the amount used</text>
  <text x="606" y="120" class="sub">Converted costs: estimated</text>
  <rect x="850" y="40" width="170" height="130" rx="10" class="card" style=""/>
  <svg x="866" y="54" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--amber)"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.8 1.2.8 1.9v1.8h6v-1.8c0-.7.3-1.4.8-1.9A6.5 6.5 0 0 0 12 2.5z"/></svg>
  <text x="902" y="72" class="title">80%</text>
  <rect x="866" y="85" width="98.8" height="21" rx="5" class="pill"/>
  <text x="874" y="100" class="code">BudgetWarned</text>
  <text x="866" y="126" class="sub">Reset when choosing</text>
  <text x="866" y="146" class="sub">steps changes the cap</text>
  <rect x="590" y="240" width="260" height="150" rx="10" class="card" style=""/>
  <svg x="606" y="254" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--amber)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="642" y="272" class="title">Checks the cap</text>
  <text x="606" y="300" class="sub">Before choosing steps</text>
  <text x="606" y="320" class="sub">Before running a step</text>
  <text x="606" y="340" class="sub">(except opening a verified PR)</text>
  <text x="606" y="360" class="sub">Before verification</text>
  <rect x="300" y="240" width="250" height="150" rx="10" class="card" style=""/>
  <svg x="316" y="254" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="352" y="272" class="title">Paused</text>
  <rect x="316" y="285" width="147.1" height="21" rx="5" class="pill"/>
  <text x="324" y="300" class="code">TaskPaused (budget)</text>
  <text x="316" y="326" class="sub">Not while awaiting approval</text>
  <text x="316" y="346" class="sub">Keeps the work</text>
  <rect x="20" y="240" width="240" height="150" rx="10" class="card" style=""/>
  <svg x="36" y="254" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7"/><path d="M18 2.5v4h-4M6 21.5v-4h4"/></svg>
  <text x="72" y="272" class="title">Resume</text>
  <rect x="36" y="285" width="119.5" height="21" rx="5" class="pill"/>
  <text x="44" y="300" class="code">BudgetCapRaised</text>
  <text x="36" y="326" class="sub">A cumulative cap above the</text>
  <text x="36" y="346" class="sub">amount used (up to $10,000)</text>
  <rect x="814.9" y="84" width="30.2" height="18" rx="4" class="label-bg"/>
  <text x="830" y="97" class="label" text-anchor="middle">80%</text>
  <rect x="747" y="197" width="95.8" height="18" rx="4" class="label-bg"/>
  <text x="752" y="210" class="label" text-anchor="start">Reached the cap</text>
  <rect x="256.5" y="293" width="47" height="18" rx="4" class="label-bg"/>
  <text x="280" y="306" class="label" text-anchor="middle">Person</text>
  <rect x="309.3" y="196" width="181.4" height="18" rx="4" class="label-bg"/>
  <text x="400" y="209" class="label" text-anchor="middle">Continues from where it stopped</text>
</svg>
