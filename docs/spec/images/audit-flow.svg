<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/audit-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">2段の監査</title>
  <desc id="desc">タスクが完了する追記で監査を登録する。大まかな監査が懸念のある工程を挙げ、工程ごとに深掘りして原因・改修の提案・メモリーを出す。提案は人が採用・却下する。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M220 155 L270 154" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M500 154 C530 154 530 78 560 78" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M500 154 C530 154 530 232 560 232" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M680 136 L680 190" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M800 232 C824 232 816 178 840 178" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="100" width="200" height="110" rx="10" class="card" style=""/>
  <svg x="36" y="114" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M5 21.5V3.5M5 4h12l-2.5 4L17 12H5"/></svg>
  <text x="72" y="132" class="title">タスクが完了</text>
  <rect x="36" y="145" width="91.9" height="21" rx="5" class="pill"/>
  <text x="44" y="160" class="code">AuditQueued</text>
  <text x="36" y="186" class="sub">同じ追記で登録</text>
  <rect x="270" y="106" width="230" height="96" rx="10" class="card" style=""/>
  <svg x="286" y="120" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="322" y="138" class="title">大まかな監査</text>
  <text x="286" y="166" class="sub">台帳とセッションログから</text>
  <text x="286" y="186" class="sub">懸念のある工程を最大 3 つ</text>
  <rect x="560" y="20" width="240" height="116" rx="10" class="card" style=""/>
  <svg x="576" y="34" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="612" y="52" class="title">深掘り</text>
  <text x="576" y="80" class="sub">工程ごとに新しいセッション</text>
  <text x="576" y="100" class="sub">原因（最大 3）・提案（各 2）</text>
  <text x="576" y="120" class="sub">メモリーの登録</text>
  <rect x="560" y="190" width="240" height="84" rx="10" class="card" style=""/>
  <svg x="576" y="204" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></svg>
  <text x="612" y="222" class="title">監査済み</text>
  <rect x="576" y="235" width="112.6" height="21" rx="5" class="pill"/>
  <text x="584" y="250" class="code">AuditCompleted</text>
  <rect x="840" y="100" width="180" height="116" rx="10" class="card" style=""/>
  <svg x="856" y="114" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="892" y="132" class="title">人が判断</text>
  <text x="856" y="160" class="sub">提案を採用・却下</text>
  <text x="856" y="180" class="sub">採用したものは</text>
  <text x="856" y="200" class="sub">改修のタスクへ</text>
  <rect x="496.3" y="87" width="67.5" height="18" rx="4" class="label-bg"/>
  <text x="530" y="100" class="label" text-anchor="middle">懸念がある</text>
  <rect x="496.3" y="203" width="67.5" height="18" rx="4" class="label-bg"/>
  <text x="530" y="216" class="label" text-anchor="middle">懸念が無い</text>
  <rect x="683" y="155" width="79" height="18" rx="4" class="label-bg"/>
  <text x="688" y="168" class="label" text-anchor="start">すべての工程</text>
</svg>
