  <path d="M370 456 L370 472 Q370 482 360 482 L200 482 Q190 482 190 492 L190 510" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M450 456 L450 472 Q450 482 460 482 L475 482 Q485 482 485 492 L485 510" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M190 620 L190 660" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="260" y="20" width="300" height="76" rx="10" class="card" style=""/>
  <svg x="276" y="34" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="312" y="52" class="title">実装の工程</text>
  <text x="276" y="80" class="sub">エージェントが実装する</text>
  <rect x="260" y="130" width="300" height="56" rx="10" class="card" style=""/>
  <svg x="276" y="145" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="312" y="163" class="title">差分を取れる？</text>
