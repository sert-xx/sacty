  <svg x="656" y="524" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="692" y="542" class="title">一時停止</text>
  <rect x="656" y="555" width="98.8" height="21" rx="5" class="pill"/>
  <text x="664" y="570" class="code">verification</text>
  <rect x="260" y="400" width="300" height="56" rx="10" class="card" style=""/>
  <svg x="276" y="415" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="312" y="433" class="title">起点から変更がある？</text>
  <rect x="40" y="510" width="300" height="110" rx="10" class="card" style=""/>
  <svg x="56" y="524" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 5 4 7.8 9.8 7.8"/></svg>
  <text x="92" y="542" class="title">実装の PR を作る</text>
  <text x="56" y="570" class="sub">sacty がコミット・プッシュする</text>
  <rect x="56" y="579" width="154" height="21" rx="5" class="pill"/>
  <text x="64" y="594" class="code">PullRequestPublished</text>
  <rect x="360" y="510" width="250" height="110" rx="10" class="card" style=""/>
  <svg x="376" y="524" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="412" y="542" class="title">PR を作らない</text>
  <text x="376" y="570" class="sub">画面で承認する</text>
  <rect x="376" y="579" width="112.6" height="21" rx="5" class="pill"/>
  <text x="384" y="594" class="code">NoChangesFound</text>
  <rect x="40" y="660" width="300" height="76" rx="10" class="card" style=""/>
  <svg x="56" y="674" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="92" y="692" class="title">実装の承認待ち</text>
  <text x="56" y="720" class="sub">PR のマージで承認する</text>
  <rect x="577.8" y="137" width="44.5" height="18" rx="4" class="label-bg"/>
  <text x="600" y="150" class="label" text-anchor="middle">いいえ</text>
  <rect x="415" y="200" width="33" height="18" rx="4" class="label-bg"/>
  <text x="420" y="213" class="label" text-anchor="start">はい</text>
  <rect x="560.5" y="239" width="79" height="18" rx="4" class="label-bg"/>
