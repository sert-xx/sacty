  <rect x="263.5" y="463" width="33" height="18" rx="4" class="label-bg"/>
  <text x="280" y="476" class="label" text-anchor="middle">ある</text>
  <rect x="453.5" y="485" width="33" height="18" rx="4" class="label-bg"/>
  <text x="470" y="498" class="label" text-anchor="middle">無い</text>
</svg>
