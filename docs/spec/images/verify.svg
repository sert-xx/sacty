  <svg x="656" y="134" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="692" y="152" class="title">一時停止</text>
  <rect x="656" y="165" width="167.8" height="21" rx="5" class="pill"/>
  <text x="664" y="180" class="code">verify.diffUnavailable</text>
  <rect x="260" y="230" width="300" height="116" rx="10" class="card" style="stroke:var(--green);stroke-width:1.5"/>
  <svg x="276" y="244" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="312" y="262" class="title">最終レビュー</text>
  <text x="276" y="290" class="sub">ゴールガーディアンが</text>
  <text x="276" y="310" class="sub">実装のイメージでテストを実行し</text>
  <text x="276" y="330" class="sub">観点ごとに判定する</text>
  <rect x="640" y="230" width="300" height="108" rx="10" class="card" style=""/>
  <svg x="656" y="244" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7M14 8.5v7"/></svg>
  <text x="692" y="262" class="title">一時停止</text>
  <rect x="656" y="275" width="160.9" height="21" rx="5" class="pill"/>
  <text x="664" y="290" class="code">verify.commandMissing</text>
  <text x="656" y="316" class="sub">再開すると最終レビューから</text>
  <rect x="640" y="380" width="300" height="84" rx="10" class="card" style=""/>
  <svg x="656" y="394" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="692" y="412" class="title">不合格が続けて3回？</text>
  <rect x="656" y="425" width="147.1" height="21" rx="5" class="pill"/>
  <text x="664" y="440" class="code">MAX_VERIFY_ATTEMPTS</text>
