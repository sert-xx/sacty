<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 950" width="1040" height="950" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/tasks-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">How a task proceeds</title>
  <desc id="desc">The information gatherer collects and summarizes the information related to the task, the orchestrator chooses the plan, and step agents run the steps. At steps with an approval gate a person decides; requesting changes redoes from the chosen step. After each step, unneeded steps are skipped.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M420 136 L420 170" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M420 266 L420 300" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M420 396 L420 430" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M420 526 L420 560" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M420 616 L420 650" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M420 746 L420 780" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M420 836 L420 870" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M580 588 L650 588 Q660 588 660 598 L660 798 Q660 808 650 808 L580 808" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M260 698 L240 698 Q230 698 230 688 L230 508 Q230 498 240 498 L260 498" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M260 808 L220 828" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M120 770 L120 468 Q120 458 130 458 L260 458" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="260" y="20" width="320" height="116" rx="10" class="card" style=""/>
  <svg x="276" y="34" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="312" y="52" class="title">Task created</text>
  <text x="276" y="80" class="sub">UI, intake, split, watch fix,</text>
  <text x="276" y="100" class="sub">scheduled task, security fix,</text>
  <text x="276" y="120" class="sub">audit proposal, rerun, follow-up</text>
  <rect x="260" y="170" width="320" height="96" rx="10" class="card" style=""/>
  <svg x="276" y="184" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="312" y="202" class="title">Information gathering</text>
  <text x="276" y="230" class="sub">From ticket parents, URLs, code,</text>
  <text x="276" y="250" class="sub">MCP, etc., then narrowed down</text>
  <rect x="260" y="300" width="320" height="96" rx="10" class="card" style=""/>
  <svg x="276" y="314" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>
  <text x="312" y="332" class="title">Orchestrator</text>
  <text x="276" y="360" class="sub">Plan, base branch,</text>
  <text x="276" y="380" class="sub">test command, and so on</text>
  <rect x="260" y="430" width="320" height="96" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="276" y="444" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="312" y="462" class="title">Run the next step</text>
  <text x="276" y="490" class="sub">Step agent</text>
  <text x="276" y="510" class="sub">Implementation runs to verification and PR</text>
  <rect x="260" y="560" width="320" height="56" rx="10" class="card" style=""/>
  <svg x="276" y="575" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="312" y="593" class="title">Step has an approval gate?</text>
  <rect x="260" y="650" width="320" height="96" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="276" y="664" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="312" y="682" class="title">Awaiting approval</text>
  <text x="276" y="710" class="sub">A person decides</text>
  <text x="276" y="730" class="sub">In the UI or by merging the PR</text>
  <rect x="260" y="780" width="320" height="56" rx="10" class="card" style=""/>
  <svg x="276" y="795" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.2-2.5 3.8M12 17.2h.01"/></svg>
  <text x="312" y="813" class="title">Steps remaining?</text>
  <rect x="260" y="870" width="320" height="56" rx="10" class="card" style=""/>
  <svg x="276" y="885" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M5 21.5V3.5M5 4h12l-2.5 4L17 12H5"/></svg>
  <text x="312" y="903" class="title">Completed (then audited)</text>
  <rect x="20" y="770" width="200" height="116" rx="10" class="card" style=""/>
  <svg x="36" y="784" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7"/><path d="M18 2.5v4h-4M6 21.5v-4h4"/></svg>
  <text x="72" y="802" class="title">Step review</text>
  <text x="36" y="830" class="sub">Skip requirements,</text>
  <text x="36" y="850" class="sub">design, or reproduction</text>
  <text x="36" y="870" class="sub">(not for a chosen plan)</text>
  <rect x="440" y="624" width="27.9" height="18" rx="4" class="label-bg"/>
  <text x="445" y="637" class="label" text-anchor="start">yes</text>
  <rect x="440" y="754" width="51.9" height="18" rx="4" class="label-bg"/>
  <text x="445" y="767" class="label" text-anchor="start">approve</text>
  <rect x="440" y="844" width="22" height="18" rx="4" class="label-bg"/>
  <text x="445" y="857" class="label" text-anchor="start">no</text>
  <rect x="665" y="687" width="164.1" height="18" rx="4" class="label-bg"/>
  <text x="670" y="700" class="label" text-anchor="start">no (e.g. reproduction, review)</text>
  <rect x="2.5" y="627" width="219.5" height="18" rx="4" class="label-bg"/>
  <text x="222" y="640" class="label" text-anchor="end">request changes (from the chosen step)</text>
  <rect x="226" y="787" width="27.9" height="18" rx="4" class="label-bg"/>
  <text x="240" y="800" class="label" text-anchor="middle">yes</text>
</svg>
