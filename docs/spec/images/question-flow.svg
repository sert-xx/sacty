<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 340" width="1040" height="340" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/question-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">オーケストレーターへの質問</title>
  <desc id="desc">人の質問（QuestionAsked）に、デーモンがタスクの台帳を入れた指示と、このタスクの実行ごとのセッションログ（読み取り専用）を用意し、オーケストレーターのセッションを複製して答えさせる（QuestionAnswered）。答えの費用はタスクの予算に入り、タスクの状態・工程・承認済みの内容は変えない。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M230 165 C255 165 255 90 280 90" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M230 165 C255 165 255 240 280 240" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M550 80 C575 80 575 145 600 145" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M550 250 C575 250 575 185 600 185" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M810 165 C834 165 826 165 850 165" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="100" width="210" height="130" rx="10" class="card" style=""/>
  <svg x="36" y="114" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="72" y="132" class="title">質問</text>
  <rect x="36" y="145" width="105.7" height="21" rx="5" class="pill"/>
  <text x="44" y="160" class="code">QuestionAsked</text>
  <text x="36" y="186" class="sub">2000 文字まで</text>
  <text x="36" y="206" class="sub">答えを待つのは1件まで</text>
  <rect x="280" y="20" width="270" height="120" rx="10" class="card" style=""/>
  <svg x="296" y="34" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="332" y="52" class="title">指示</text>
  <text x="296" y="80" class="sub">台帳：状態・工程・PR・費用</text>
  <text x="296" y="100" class="sub">成果・指摘・作業履歴</text>
  <text x="296" y="120" class="sub">（40000 文字まで）</text>
  <rect x="280" y="180" width="270" height="140" rx="10" class="card" style=""/>
  <svg x="296" y="194" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="332" y="212" class="title">セッションログ</text>
  <rect x="296" y="225" width="91.9" height="21" rx="5" class="pill"/>
  <text x="304" y="240" class="code">/sacty-logs</text>
  <text x="296" y="266" class="sub">このタスクの実行ごと</text>
  <text x="296" y="286" class="sub">読み取り専用・実行中は写し</text>
  <rect x="600" y="90" width="210" height="150" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="616" y="104" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/></svg>
  <text x="652" y="122" class="title">オーケストレーター</text>
  <text x="616" y="150" class="sub">セッションを複製</text>
  <text x="616" y="170" class="sub">起点のコードの写し</text>
  <text x="616" y="190" class="sub">を読む</text>
  <rect x="850" y="90" width="170" height="150" rx="10" class="card" style=""/>
  <svg x="866" y="104" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></svg>
  <text x="902" y="122" class="title">答え</text>
  <rect x="866" y="135" width="126.4" height="21" rx="5" class="pill"/>
  <text x="874" y="150" class="code">QuestionAnswered</text>
  <text x="866" y="176" class="sub">20000 文字まで</text>
  <text x="866" y="196" class="sub">費用は予算に</text>
  <text x="866" y="216" class="sub">状態は変えない</text>
  <text x="125" y="260" class="label" text-anchor="middle">中止・予算の上限では断る</text>
</svg>
