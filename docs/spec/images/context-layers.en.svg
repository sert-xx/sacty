<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/context-layers.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">Context layers and inheritance</title>
  <desc id="desc">The default context is on top, then the ancestors of the inheritance chain, and the context the project specifies is at the bottom. A lower layer points to an upper one with extends.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M170 106 L170 150" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M170 226 L170 270" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M170 326 L170 370" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M410 370 L410 326" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <path d="M410 270 L410 226" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <rect x="60" y="30" width="460" height="76" rx="10" class="card" style=""/>
  <svg x="76" y="44" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="112" y="62" class="title">sacty default context (top)</text>
  <text x="76" y="90" class="sub">apps/daemon/default-context</text>
  <rect x="60" y="150" width="460" height="76" rx="10" class="card" style=""/>
  <svg x="76" y="164" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="112" y="182" class="title">Topmost ancestor in the chain</text>
  <text x="76" y="210" class="sub">Pointed to by another layer's extends</text>
  <rect x="60" y="270" width="460" height="56" rx="10" class="card" style=""/>
  <text x="290" y="303" class="title" text-anchor="middle">…</text>
  <rect x="60" y="370" width="460" height="76" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="76" y="384" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="112" y="402" class="title">Context the project specifies (bottom)</text>
  <text x="76" y="430" class="sub">repo・ref・path</text>
  <rect x="580" y="30" width="440" height="236" rx="10" class="card" style=""/>
  <svg x="596" y="44" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>
  <text x="632" y="62" class="title">How layers combine</text>
  <text x="596" y="90" class="strong">Rules (rules.md)</text>
  <text x="596" y="110" class="sub">Concatenated from the top layer down</text>
  <text x="596" y="130" class="strong">Skills, MCP servers, PFs</text>
  <text x="596" y="150" class="sub">Lower layers override by name (locked, remove)</text>
  <text x="596" y="170" class="strong">Agent settings</text>
  <text x="596" y="190" class="sub">Tables merge by key; other values take the lower one</text>
  <text x="596" y="210" class="sub">permissions allow, deny, and ask are combined</text>
  <rect x="580" y="290" width="440" height="156" rx="10" class="card" style=""/>
  <svg x="596" y="304" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="632" y="322" class="title">What extends can name</text>
  <rect x="596" y="335" width="91.9" height="21" rx="5" class="pill"/>
  <text x="604" y="350" class="code">&lt;URL&gt;#&lt;ref&gt;</text>
  <rect x="596" y="361" width="147.1" height="21" rx="5" class="pill"/>
  <text x="604" y="376" class="code">{ repo, ref, path }</text>
  <rect x="596" y="387" width="216.1" height="21" rx="5" class="pill"/>
  <text x="604" y="402" class="code">./… or ../… (same repository)</text>
  <text x="596" y="428" class="sub">Up to 10 layers; a cycle stops</text>
  <rect x="145.3" y="120" width="49.3" height="18" rx="4" class="label-bg"/>
  <text x="170" y="133" class="label" text-anchor="middle">layered</text>
  <rect x="145.3" y="240" width="49.3" height="18" rx="4" class="label-bg"/>
  <text x="170" y="253" class="label" text-anchor="middle">layered</text>
  <rect x="145.3" y="340" width="49.3" height="18" rx="4" class="label-bg"/>
  <text x="170" y="353" class="label" text-anchor="middle">layered</text>
  <rect x="384.1" y="340" width="51.9" height="18" rx="4" class="label-bg"/>
  <text x="410" y="353" class="label" text-anchor="middle">extends</text>
  <rect x="384.1" y="240" width="51.9" height="18" rx="4" class="label-bg"/>
  <text x="410" y="253" class="label" text-anchor="middle">extends</text>
</svg>
