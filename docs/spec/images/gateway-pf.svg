<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/gateway-pf.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">組織内 PF の中継の流れ</title>
  <desc id="desc">ゲートウェイは PF を探し、allow と照合し、必要ならトークンを取得してから、認証のヘッダーを付けて PF に送る。401・403 ならトークンを取り直して1回だけ送り直す。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="330" y="230" width="430" height="112" rx="8" style="fill:none;stroke:var(--amber-line);stroke-dasharray:6 4"/>
  <text x="340" y="248" class="label" style="fill:var(--amber)">auth.token で、トークンが無いか期限の30秒前を過ぎた</text>
  <rect x="330" y="440" width="660" height="100" rx="8" style="fill:none;stroke:var(--amber-line);stroke-dasharray:6 4"/>
  <text x="340" y="458" class="label" style="fill:var(--amber)">auth.token の PF が 401・403 を返した</text>
  <path d="M120 72 V585" class="lifeline"/>
  <path d="M400 72 V585" class="lifeline"/>
  <path d="M690 72 V585" class="lifeline"/>
  <path d="M930 72 V585" class="lifeline"/>
  <path d="M120 110 H398" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M400 135 L428 135 Q434 135 434 141 L434 147 Q434 153 428 153 L404 153" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M400 185 L428 185 Q434 185 434 191 L434 197 Q434 203 428 203 L404 203" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M400 282 H688" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M690 320 H402" class="muted" marker-end="url(#ah-arrow)"/>
  <path d="M400 380 H928" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M930 418 H402" class="muted" marker-end="url(#ah-arrow)"/>
  <path d="M400 484 H688" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M400 522 H928" class="flow" marker-end="url(#ah-arrow)"/>
  <path d="M400 568 H122" class="muted" marker-end="url(#ah-arrow)"/>
  <rect x="25" y="20" width="190" height="52" rx="10" class="card" style=""/>
  <svg x="41" y="33" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="77" y="51" class="title">エージェント</text>
  <rect x="305" y="20" width="190" height="52" rx="10" class="card" style=""/>
  <svg x="321" y="33" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="357" y="51" class="title">ゲートウェイ</text>
  <rect x="595" y="20" width="190" height="52" rx="10" class="card" style=""/>
  <svg x="611" y="33" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--amber)"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 9-9M16.5 6.5l2.5 2.5M14 9l2 2"/></svg>
  <text x="647" y="51" class="title">トークンの窓口</text>
  <rect x="835" y="20" width="190" height="52" rx="10" class="card" style=""/>
  <svg x="851" y="33" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><rect x="3.5" y="3.5" width="17" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
  <text x="887" y="51" class="title">PF（upstream）</text>
  <text x="259" y="103" class="label" text-anchor="middle">/r/トークン/pf/名前/パス</text>
  <rect x="439" y="135" width="418.7" height="18" rx="4" class="label-bg"/>
  <text x="444" y="148" class="label" text-anchor="start">ホストの PF、無ければトークンのプロジェクトの PF を探す（無ければ 404）</text>
  <rect x="439" y="185" width="324.9" height="18" rx="4" class="label-bg"/>
  <text x="444" y="198" class="label" text-anchor="start">allow と照合する（合わなければ 403 と使える API の一覧）</text>
  <text x="544" y="275" class="label" text-anchor="middle">キーを入れて取得する</text>
  <text x="546" y="313" class="label" text-anchor="middle">トークンと期限</text>
  <text x="664" y="373" class="label" text-anchor="middle">エージェントの認証・cookie を除き、認証のヘッダーを付けて送る</text>
  <text x="666" y="411" class="label" text-anchor="middle">応答</text>
  <text x="544" y="477" class="label" text-anchor="middle">トークンを取り直す</text>
  <text x="664" y="515" class="label" text-anchor="middle">1回だけ送り直す</text>
  <text x="261" y="561" class="label" text-anchor="middle">応答（リダイレクトはたどらない）</text>
</svg>
