  <rect x="56" y="175" width="271.3" height="21" rx="5" class="pill"/>
  <text x="64" y="190" class="code">git@github.com:acme/sacty-context.git</text>
  <text x="56" y="216" class="sub">ブランチ main</text>
  <rect x="40" y="280" width="440" height="84" rx="10" class="card" style=""/>
  <svg x="56" y="294" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="92" y="312" class="title">チームで共通</text>
  <rect x="56" y="325" width="220.7" height="21" rx="5" class="pill"/>
