  <rect x="40" y="410" width="440" height="84" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="56" y="424" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="92" y="442" class="title">プロジェクトの設定で指定</text>
  <rect x="56" y="455" width="220.7" height="21" rx="5" class="pill"/>
  <text x="64" y="470" class="code">acme/monorepo の contexts/team</text>
  <rect x="560" y="280" width="460" height="84" rx="10" class="card" style=""/>
  <svg x="576" y="294" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="612" y="312" class="title">contexts/base/sacty-context.yaml</text>
  <rect x="576" y="325" width="367.9" height="21" rx="5" class="pill"/>
  <text x="584" y="340" class="code">extends: git@github.com:acme/sacty-context.git#main</text>
  <rect x="560" y="410" width="460" height="84" rx="10" class="card" style=""/>
  <svg x="576" y="424" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8z"/><path d="M14 2.5V8h5.5M8 13h8M8 17h5"/></svg>
  <text x="612" y="442" class="title">contexts/team/sacty-context.yaml</text>
  <rect x="576" y="455" width="126.4" height="21" rx="5" class="pill"/>
  <text x="584" y="470" class="code">extends: ../base</text>
