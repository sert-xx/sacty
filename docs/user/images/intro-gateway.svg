<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" width="1040" height="360" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/intro-gateway.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">鍵はゲートウェイが持つ</title>
  <desc id="desc">AI エージェントは使い捨てのコンテナの中で動き、ゲートウェイを通す呼び出しには実行ごとのトークンだけを使う。社内の API・MCP サーバー・GitHub の読み取りは、あなたのマシンで動くゲートウェイが鍵を付けて中継し、許可していない操作は断る。AI の呼び出しも、設定すればゲートウェイを通せる。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="20" y="70" width="270" height="170" rx="14" style="fill:var(--blue-bg);stroke:var(--blue-line)"/>
  <text x="40" y="96" class="zone" style="fill:var(--blue)">使い捨てのコンテナ</text>
  <path d="M270 162 L370 162" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M640 132 C690 132 690 58 740 58" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M640 162 C690 162 690 162 740 162" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M640 192 C690 192 690 266 740 266" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <path d="M505 262 L505 222" class="muted" style="stroke:var(--amber)" marker-end="url(#ah-amber)"/>
  <rect x="40" y="112" width="230" height="100" rx="10" class="card" style=""/>
  <svg x="56" y="126" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="92" y="144" class="title">AI エージェント</text>
  <text x="56" y="172" class="sub">中継する先の鍵は持たない</text>
  <text x="56" y="192" class="sub">実行ごとのトークンだけ</text>
  <rect x="370" y="102" width="270" height="120" rx="10" class="card" style="stroke:var(--green);stroke-width:1.5"/>
  <svg x="386" y="116" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="422" y="134" class="title">ゲートウェイ</text>
  <text x="386" y="162" class="sub">あなたのマシンで動く</text>
  <text x="386" y="182" class="sub">鍵を付けて中継する</text>
  <text x="386" y="202" class="sub">許可していない操作は断る</text>
  <rect x="370" y="262" width="270" height="76" rx="10" class="card" style="stroke:var(--amber);stroke-dasharray:5 4"/>
  <svg x="386" y="276" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--amber)"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 9-9M16.5 6.5l2.5 2.5M14 9l2 2"/></svg>
  <text x="422" y="294" class="title">鍵</text>
  <text x="386" y="322" class="sub">キーチェーン・1Password</text>
  <rect x="740" y="20" width="280" height="76" rx="10" class="card" style=""/>
  <svg x="756" y="34" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><rect x="3.5" y="3.5" width="17" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
  <text x="792" y="52" class="title">社内の API・MCP</text>
  <text x="756" y="80" class="sub">JIRA・社内の仕組みなど</text>
  <rect x="740" y="124" width="280" height="76" rx="10" class="card" style=""/>
  <svg x="756" y="138" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2c0 4.8-4 5.3-8.5 6.6-1.6.5-2.9 1.1-3.5 1.4"/></svg>
  <text x="792" y="156" class="title">GitHub</text>
  <text x="756" y="184" class="sub">読み取りだけ</text>
  <rect x="740" y="228" width="280" height="76" rx="10" class="card" style=""/>
  <svg x="756" y="242" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/></svg>
  <text x="792" y="260" class="title">AI の接続先</text>
  <text x="756" y="288" class="sub">設定すればゲートウェイ経由</text>
  <rect x="292" y="143" width="56" height="18" rx="4" class="label-bg"/>
  <text x="320" y="156" class="label" text-anchor="middle">トークン</text>
  <rect x="494.3" y="233" width="21.5" height="18" rx="4" class="label-bg"/>
  <text x="505" y="246" class="label" text-anchor="middle">鍵</text>
</svg>
