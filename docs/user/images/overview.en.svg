  <svg x="516" y="100" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
  <text x="552" y="118" class="title">Daemon</text>
  <text x="516" y="146" class="sub">Activity log, step runs,</text>
  <text x="516" y="166" class="sub">intake, PR checks</text>
  <rect x="500" y="236" width="230" height="96" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="516" y="250" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="552" y="268" class="title">Agents</text>
  <text x="516" y="296" class="sub">Orchestrator, steps,</text>
  <text x="516" y="316" class="sub">goal guardian (containers)</text>
  <rect x="230" y="356" width="220" height="76" rx="10" class="card" style=""/>
  <svg x="246" y="370" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="282" y="388" class="title">Gateway</text>
  <text x="246" y="416" class="sub">Holds the credentials</text>
  <rect x="800" y="76" width="220" height="76" rx="10" class="card" style=""/>
  <svg x="816" y="90" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2c0 4.8-4 5.3-8.5 6.6-1.6.5-2.9 1.1-3.5 1.4"/></svg>
  <text x="852" y="108" class="title">GitHub</text>
  <text x="816" y="136" class="sub">Issue・PR</text>
  <rect x="800" y="220" width="220" height="76" rx="10" class="card" style=""/>
  <svg x="816" y="234" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/></svg>
  <text x="852" y="252" class="title">AI endpoint</text>
  <text x="816" y="280" class="sub">Claude・Codex</text>
