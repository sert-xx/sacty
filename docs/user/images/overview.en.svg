  <text x="105" y="180" class="label" text-anchor="middle">create, approve</text>
  <rect x="729.8" y="133" width="70.5" height="18" rx="4" class="label-bg"/>
  <text x="765" y="146" class="label" text-anchor="middle">intake, PRs</text>
  <rect x="620" y="201" width="45.9" height="18" rx="4" class="label-bg"/>
  <text x="625" y="214" class="label" text-anchor="start">starts</text>
  <rect x="742.5" y="291" width="52.6" height="18" rx="4" class="label-bg"/>
  <text x="795" y="304" class="label" text-anchor="end">AI calls</text>
  <rect x="377.4" y="265" width="85.2" height="18" rx="4" class="label-bg"/>
  <text x="420" y="278" class="label" text-anchor="middle">per-run token</text>
  <rect x="650.5" y="447" width="79" height="18" rx="4" class="label-bg"/>
  <text x="690" y="460" class="label" text-anchor="middle">GitHub reads</text>
  <rect x="433.1" y="15" width="133.7" height="18" rx="4" class="label-bg"/>
  <text x="500" y="28" class="label" text-anchor="middle">approve by merging PRs</text>
</svg>
