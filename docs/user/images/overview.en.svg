  <svg x="816" y="370" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><rect x="3.5" y="3.5" width="17" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
  <text x="852" y="388" class="title">PFs, MCP servers</text>
  <text x="816" y="416" class="sub">Internal APIs, etc.</text>
