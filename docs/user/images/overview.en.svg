  <svg x="36" y="211" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="72" y="229" class="title">You</text>
  <rect x="230" y="96" width="220" height="76" rx="10" class="card" style=""/>
  <svg x="246" y="110" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 8.5h19M6 6.3h.01M8.5 6.3h.01"/></svg>
  <text x="282" y="128" class="title">Web UI</text>
  <text x="246" y="156" class="sub">Open in a browser</text>
