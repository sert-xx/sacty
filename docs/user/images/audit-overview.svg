<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 270" width="1040" height="270" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/audit-overview.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">監査の流れ</title>
  <desc id="desc">タスクが完了すると大まかな監査が懸念のある工程を挙げ、工程ごとに深掘りして原因と改修の提案を出す。提案はあなたが採用・却下する。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M200 124 L240 124" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M470 124 C495 124 495 68 520 68" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M470 124 C495 124 495 198 520 198" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M645 116 L645 170" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M770 198 C794 198 786 144 810 144" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="96" width="180" height="56" rx="10" class="card" style=""/>
  <svg x="36" y="111" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M5 21.5V3.5M5 4h12l-2.5 4L17 12H5"/></svg>
  <text x="72" y="129" class="title">タスクが完了</text>
  <rect x="240" y="86" width="230" height="76" rx="10" class="card" style=""/>
  <svg x="256" y="100" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="292" y="118" class="title">大まかな監査</text>
  <text x="256" y="146" class="sub">懸念のある工程を最大 3 つ</text>
  <rect x="520" y="20" width="250" height="96" rx="10" class="card" style=""/>
  <svg x="536" y="34" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="572" y="52" class="title">深掘り</text>
  <text x="536" y="80" class="sub">工程ごとに原因と改修の提案</text>
  <text x="536" y="100" class="sub">メモリーの登録</text>
  <rect x="520" y="170" width="250" height="56" rx="10" class="card" style=""/>
  <svg x="536" y="185" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></svg>
  <text x="572" y="203" class="title">監査済み</text>
  <rect x="810" y="76" width="210" height="96" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="826" y="90" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="862" y="108" class="title">あなたが判断</text>
  <text x="826" y="136" class="sub">採用 → 改修のタスク</text>
  <text x="826" y="156" class="sub">却下 → 理由を残す</text>
  <rect x="461.3" y="71" width="67.5" height="18" rx="4" class="label-bg"/>
  <text x="495" y="84" class="label" text-anchor="middle">懸念がある</text>
  <rect x="461.3" y="173" width="67.5" height="18" rx="4" class="label-bg"/>
  <text x="495" y="186" class="label" text-anchor="middle">懸念が無い</text>
</svg>
