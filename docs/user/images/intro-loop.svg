<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/intro-loop.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">回すほど賢くなる</title>
  <desc id="desc">タスクが完了すると、AI がその過程を監査して、つまずきの原因と、それを防ぐ改修を提案する。あなたが提案を採用すると、改修のタスクになる。次のタスクにも役立つ知見はメモリーに残り、次のタスクの AI が読む。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M340 62 L700 62" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M910 126 L910 290" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M700 338 L340 338" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M130 290 L130 126" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M760 126 L760 198 Q760 208 750 208 L670 208" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <path d="M370 208 L290 208 Q280 208 280 198 L280 126" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <rect x="40" y="30" width="300" height="96" rx="10" class="card" style=""/>
  <svg x="56" y="44" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="92" y="62" class="title">タスクを進める</text>
  <text x="56" y="90" class="sub">AI が工程に沿って作業する</text>
  <rect x="700" y="30" width="300" height="96" rx="10" class="card" style=""/>
  <svg x="716" y="44" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="752" y="62" class="title">監査</text>
  <text x="716" y="90" class="sub">差し戻しや試行錯誤の原因を探す</text>
  <rect x="700" y="290" width="300" height="96" rx="10" class="card" style=""/>
  <svg x="716" y="304" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.6.5.8 1.2.8 1.9v1.8h6v-1.8c0-.7.3-1.4.8-1.9A6.5 6.5 0 0 0 12 2.5z"/></svg>
  <text x="752" y="322" class="title">改修の提案</text>
  <text x="716" y="350" class="sub">ルール・スキル・テストなどを直す案</text>
  <rect x="40" y="290" width="300" height="96" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="56" y="304" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="92" y="322" class="title">あなたが採用する</text>
  <text x="56" y="350" class="sub">採用した提案は改修のタスクになる</text>
  <rect x="370" y="162" width="300" height="92" rx="10" class="card" style=""/>
  <svg x="386" y="176" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>
  <text x="422" y="194" class="title">メモリー</text>
  <text x="386" y="222" class="sub">次のタスクにも役立つ知見</text>
  <rect x="469" y="55" width="102" height="18" rx="4" class="label-bg"/>
  <text x="520" y="68" class="label" text-anchor="middle">完了したら自動で</text>
  <rect x="73.3" y="199" width="113.5" height="18" rx="4" class="label-bg"/>
  <text x="130" y="212" class="label" text-anchor="middle">次のタスクから効く</text>
  <rect x="726.3" y="137" width="67.5" height="18" rx="4" class="label-bg"/>
  <text x="760" y="150" class="label" text-anchor="middle">知見を残す</text>
  <rect x="229" y="137" width="102" height="18" rx="4" class="label-bg"/>
  <text x="280" y="150" class="label" text-anchor="middle">次のタスクで読む</text>
</svg>
