<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/intro-context.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">Layering your team's way of working</title>
  <desc id="desc">The context you set for the project, and the contexts it inherits from, are layered on top of sacty's default context. How many layers there are and how they are divided is up to you; company-wide and team-wide are examples. Each lower layer inherits the layer above and adds to or overrides it. The task's AI agents use the combined rules, skills, MCP servers, and internal APIs.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="20" y="20" width="460" height="420" rx="14" style="fill:var(--gray-bg);stroke:var(--gray-line)"/>
  <text x="40" y="46" class="zone" style="fill:var(--gray)">Context (layered from the top)</text>
  <path d="M250 140 L250 162" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M250 238 L250 260" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M250 336 L250 358" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M480 230 L620 230" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="40" y="64" width="420" height="76" rx="10" class="card" style=""/>
  <svg x="56" y="78" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="92" y="96" class="title">sacty defaults</text>
  <text x="56" y="124" class="sub">How to review, write, and state requirements</text>
  <rect x="40" y="162" width="420" height="76" rx="10" class="card" style="stroke:var(--gray-line);stroke-dasharray:5 4"/>
  <svg x="56" y="176" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="92" y="194" class="title">Company-wide (example)</text>
  <text x="56" y="222" class="sub">Company rules, internal APIs, MCP servers</text>
  <rect x="40" y="260" width="420" height="76" rx="10" class="card" style="stroke:var(--gray-line);stroke-dasharray:5 4"/>
  <svg x="56" y="274" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="92" y="292" class="title">Team-wide (example)</text>
  <text x="56" y="320" class="sub">Team conventions and skills</text>
  <rect x="40" y="358" width="420" height="76" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="56" y="372" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
  <text x="92" y="390" class="title">Project</text>
  <text x="56" y="418" class="sub">Additions and overrides for this project</text>
  <rect x="620" y="166" width="400" height="128" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="636" y="180" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="672" y="198" class="title">The task's AI agents</text>
  <text x="636" y="226" class="sub">Work with the combined rules, skills,</text>
  <text x="636" y="246" class="sub">MCP servers, and internal APIs</text>
  <text x="636" y="266" class="sub">No need to explain each time</text>
  <rect x="257" y="142" width="123.9" height="18" rx="4" class="label-bg"/>
  <text x="262" y="155" class="label" text-anchor="start">inherit, add, override</text>
  <rect x="522.3" y="211" width="55.3" height="18" rx="4" class="label-bg"/>
  <text x="550" y="224" class="label" text-anchor="middle">combined</text>
</svg>
