<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/intro-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">依頼から PR での判断まで</title>
  <desc id="desc">あなたが画面・Issue・JIRA からやりたいことを依頼すると、sacty の AI エージェントが、前提を集め、進め方を選び、工程ごとに成果を作り、別の AI エージェントのレビューで直してから PR を出す。あなたは PR をマージして承認するか、コメントで差し戻す。承認すると次の工程へ進み、差し戻すと直しに戻る。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="20" y="20" width="1000" height="150" rx="14" style="fill:var(--purple-bg);stroke:var(--purple-line)"/>
  <text x="40" y="46" class="zone" style="fill:var(--purple)">あなた</text>
  <rect x="20" y="210" width="1000" height="150" rx="14" style="fill:var(--blue-bg);stroke:var(--blue-line)"/>
  <text x="40" y="236" class="zone" style="fill:var(--blue)">sacty の AI エージェント</text>
  <path d="M231 154 L231 252" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M262 298 L286 298" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M508 298 L532 298" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M754 298 L778 298" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M929 252 L929 154" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M778 108 L653 108 Q643 108 643 118 L643 252" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="40" y="62" width="222" height="92" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="56" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="92" y="94" class="title">依頼する</text>
  <text x="56" y="122" class="sub">やりたいことを書く</text>
  <text x="56" y="142" class="sub">画面・Issue・JIRA から</text>
  <rect x="778" y="62" width="222" height="92" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="794" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 5 4 7.8 9.8 7.8"/></svg>
  <text x="830" y="94" class="title">判断する</text>
  <text x="794" y="122" class="sub">PR をマージすれば承認</text>
  <text x="794" y="142" class="sub">コメントすれば差し戻し</text>
  <rect x="40" y="252" width="222" height="92" rx="10" class="card" style=""/>
  <svg x="56" y="266" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="92" y="284" class="title">下調べ</text>
  <text x="56" y="312" class="sub">チケット・コード・資料から</text>
  <text x="56" y="332" class="sub">前提を集める</text>
  <rect x="286" y="252" width="222" height="92" rx="10" class="card" style=""/>
  <svg x="302" y="266" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>
  <text x="338" y="284" class="title">計画</text>
  <text x="302" y="312" class="sub">作業に合わせて</text>
  <text x="302" y="332" class="sub">進め方を選ぶ</text>
  <rect x="532" y="252" width="222" height="92" rx="10" class="card" style=""/>
  <svg x="548" y="266" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="584" y="284" class="title">作業</text>
  <text x="548" y="312" class="sub">工程ごとに成果を作る</text>
  <text x="548" y="332" class="sub">（要求要件・設計・実装）</text>
  <rect x="778" y="252" width="222" height="92" rx="10" class="card" style=""/>
  <svg x="794" y="266" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></svg>
  <text x="830" y="284" class="title">AI のレビュー</text>
  <text x="794" y="312" class="sub">別の AI が PR をレビューし、</text>
  <text x="794" y="332" class="sub">指摘が無くなるまで直す</text>
  <rect x="936" y="183" width="62.2" height="18" rx="4" class="label-bg"/>
  <text x="941" y="196" class="label" text-anchor="start">PR が届く</text>
  <rect x="391" y="183" width="240" height="18" rx="4" class="label-bg"/>
  <text x="631" y="196" class="label" text-anchor="end">承認したら次の工程へ・差し戻したら直しへ</text>
</svg>
