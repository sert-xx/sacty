<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" width="1040" height="370" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/context-mcp-placement.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">MCP サーバーが動く場所</title>
  <desc id="desc">command のサーバーは既定でホストのゲートウェイが起動し、url のサーバーはゲートウェイが中継する。via_gateway: false を書いたものは、コンテナの中で起動するか、コンテナから直接つなぐ。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="20" y="60" width="360" height="290" rx="14" style="fill:var(--blue-bg);stroke:var(--blue-line)"/>
  <text x="40" y="86" class="zone" style="fill:var(--blue)">工程エージェントのコンテナ</text>
  <rect x="430" y="60" width="300" height="290" rx="14" style="fill:var(--green-bg);stroke:var(--green-line)"/>
  <text x="450" y="86" class="zone" style="fill:var(--green)">sacty を動かすホスト</text>
  <path d="M360 128 L450 128" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M580 156 L580 230" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M710 128 L780 128" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M200 156 L200 230" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M300 100 L300 40 Q300 30 310 30 L890 30 Q900 30 900 40 L900 100" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <rect x="40" y="100" width="320" height="56" rx="10" class="card" style=""/>
  <svg x="56" y="115" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="92" y="133" class="title">エージェント</text>
  <rect x="40" y="230" width="320" height="96" rx="10" class="card" style=""/>
  <svg x="56" y="244" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/></svg>
  <text x="92" y="262" class="title">コンテナの中で起動</text>
  <rect x="56" y="275" width="209.2" height="21" rx="5" class="pill"/>
  <text x="64" y="290" class="code">command + via_gateway: false</text>
  <rect x="450" y="100" width="260" height="56" rx="10" class="card" style=""/>
  <svg x="466" y="115" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="502" y="133" class="title">ゲートウェイ</text>
  <rect x="450" y="230" width="260" height="96" rx="10" class="card" style="stroke:var(--green);stroke-width:1.5"/>
  <svg x="466" y="244" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/></svg>
  <text x="502" y="262" class="title">ホストで起動（既定）</text>
  <text x="466" y="290" class="sub">command のサーバー</text>
  <text x="466" y="310" class="sub">層のリポジトリの写しで動く</text>
  <rect x="780" y="100" width="240" height="96" rx="10" class="card" style=""/>
  <svg x="796" y="114" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="M9 2.5v4.5M15 2.5v4.5M6.5 7h11v3.5a5.5 5.5 0 0 1-11 0zM12 16v5.5"/></svg>
  <text x="832" y="132" class="title">url のサーバー</text>
  <text x="796" y="160" class="sub">ヘッダーの秘密情報は</text>
  <text x="796" y="180" class="sub">ゲートウェイが付ける</text>
  <rect x="361.6" y="107" width="86.8" height="18" rx="4" class="label-bg"/>
  <text x="405" y="120" class="label" text-anchor="middle">/ctx-mcp/名前</text>
  <rect x="469.1" y="21" width="181.8" height="18" rx="4" class="label-bg"/>
  <text x="560" y="34" class="label" text-anchor="middle">url + via_gateway: false（直接）</text>
</svg>
