<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" width="1040" height="420" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/gateway-overview.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">ゲートウェイを通る経路</title>
  <desc id="desc">工程エージェントのコンテナは実行ごとのトークンだけを持つ。ゲートウェイが認証の値を付けて、AI の接続先・組織内 PF・GitHub・MCP サーバーへ中継する。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="20" y="110" width="270" height="170" rx="14" style="fill:var(--blue-bg);stroke:var(--blue-line)"/>
  <text x="40" y="136" class="zone" style="fill:var(--blue)">工程エージェントのコンテナ</text>
  <path d="M270 198 L350 198" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M610 168 C645 168 645 62 680 62" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M610 188 C645 188 645 160 680 160" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M610 208 C645 208 645 258 680 258" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M610 228 C645 228 645 356 680 356" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M480 310 L480 256" class="muted" style="stroke:var(--amber)" marker-end="url(#ah-amber)"/>
  <rect x="40" y="150" width="230" height="96" rx="10" class="card" style=""/>
  <svg x="56" y="164" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="92" y="182" class="title">エージェント</text>
  <text x="56" y="210" class="sub">実行ごとのトークン</text>
  <text x="56" y="230" class="sub">だけを持つ</text>
  <rect x="350" y="140" width="260" height="116" rx="10" class="card" style="stroke:var(--green);stroke-width:1.5"/>
  <svg x="366" y="154" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--green)"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/></svg>
  <text x="402" y="172" class="title">ゲートウェイ</text>
  <text x="366" y="200" class="sub">ホストの 127.0.0.1</text>
  <text x="366" y="220" class="sub">認証の値を付けて中継する</text>
  <text x="366" y="240" class="sub">許可していない API は断る</text>
  <rect x="350" y="310" width="260" height="76" rx="10" class="card" style="stroke:var(--amber);stroke-dasharray:5 4"/>
  <svg x="366" y="324" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--amber)"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 9-9M16.5 6.5l2.5 2.5M14 9l2 2"/></svg>
  <text x="402" y="342" class="title">秘密情報</text>
  <text x="366" y="370" class="sub">キーチェーン・1Password・gh</text>
  <rect x="680" y="20" width="340" height="84" rx="10" class="card" style=""/>
  <svg x="696" y="34" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><rect x="5.5" y="5.5" width="13" height="13" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2.5v3M15 2.5v3M9 18.5v3M15 18.5v3M2.5 9h3M2.5 15h3M18.5 9h3M18.5 15h3"/></svg>
  <text x="732" y="52" class="title">AI の接続先</text>
  <rect x="696" y="65" width="220.7" height="21" rx="5" class="pill"/>
  <text x="704" y="80" class="code">providers.codex の via_gateway</text>
  <rect x="680" y="118" width="340" height="84" rx="10" class="card" style=""/>
  <svg x="696" y="132" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><rect x="3.5" y="3.5" width="17" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
  <text x="732" y="150" class="title">組織内 PF の API</text>
  <rect x="696" y="163" width="149.4" height="21" rx="5" class="pill"/>
  <text x="704" y="178" class="code">$SACTY_PF_URL/名前/…</text>
  <rect x="680" y="216" width="340" height="84" rx="10" class="card" style=""/>
  <svg x="696" y="230" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2c0 4.8-4 5.3-8.5 6.6-1.6.5-2.9 1.1-3.5 1.4"/></svg>
  <text x="732" y="248" class="title">GitHub の API（読み取りだけ）</text>
  <rect x="696" y="261" width="188.5" height="21" rx="5" class="pill"/>
  <text x="704" y="276" class="code">$SACTY_GITHUB_URL/ホスト/…</text>
  <rect x="680" y="314" width="340" height="84" rx="10" class="card" style=""/>
  <svg x="696" y="328" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--gray)"><path d="M9 2.5v4.5M15 2.5v4.5M6.5 7h11v3.5a5.5 5.5 0 0 1-11 0zM12 16v5.5"/></svg>
  <text x="732" y="346" class="title">MCP サーバー</text>
  <rect x="696" y="359" width="213.8" height="21" rx="5" class="pill"/>
  <text x="704" y="374" class="code">gateway.mcp_servers・mcp.yaml</text>
  <rect x="452" y="275" width="56" height="18" rx="4" class="label-bg"/>
  <text x="480" y="288" class="label" text-anchor="middle">認証の値</text>
</svg>
