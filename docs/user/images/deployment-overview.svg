<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/deployment-overview.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">マージの後の監視の流れ</title>
  <desc id="desc">実装の PR をマージすると、sacty がマージのコミットの CI/CD を確かめ、通ればエージェントがスキルに従って確かめる。失敗すれば修正のタスクを登録するか決める。どの結果でも、監視が終わるとタスクは完了する。</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <path d="M210 208 L260 208" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M375 160 L375 85 Q375 75 385 75 L540 75" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M790 58 L850 58" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M790 95 C820 95 820 158 850 158" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M745 130 L745 294 Q745 304 755 304 L850 304" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M490 198 L850 198" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M490 228 L760 228 Q770 228 770 238 L770 320 Q770 330 780 330 L850 330" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M375 256 L375 408 Q375 418 385 418 L850 418" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="170" width="190" height="76" rx="10" class="card" style=""/>
  <svg x="36" y="184" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--purple)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 5 4 7.8 9.8 7.8"/></svg>
  <text x="72" y="202" class="title">PR をマージ</text>
  <text x="36" y="230" class="sub">監視が始まる</text>
  <rect x="260" y="160" width="230" height="96" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="276" y="174" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
  <text x="312" y="192" class="title">CI/CD</text>
  <text x="276" y="220" class="sub">マージのコミットを</text>
  <text x="276" y="240" class="sub">sacty が1分ごとに確かめる</text>
  <rect x="540" y="20" width="250" height="110" rx="10" class="card" style="stroke:var(--blue);stroke-width:1.5"/>
  <svg x="556" y="34" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--blue)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="592" y="52" class="title">スキルで確かめる</text>
  <rect x="556" y="65" width="147.1" height="21" rx="5" class="pill"/>
  <text x="564" y="80" class="code">deployment-observer</text>
  <text x="556" y="106" class="sub">エージェントが確かめる</text>
  <rect x="850" y="20" width="170" height="76" rx="10" class="card" style=""/>
  <svg x="866" y="34" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--green)"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></svg>
  <text x="902" y="52" class="title">問題なし</text>
  <text x="866" y="80" class="sub">監視を終える</text>
  <rect x="850" y="120" width="170" height="136" rx="10" class="card" style=""/>
  <svg x="866" y="134" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--red)"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
  <text x="902" y="152" class="title">修正のタスク</text>
  <text x="866" y="180" class="sub">登録するか決める</text>
  <text x="866" y="200" class="sub">同じ失敗の修正が</text>
  <text x="866" y="220" class="sub">終わっていない・上限</text>
  <text x="866" y="240" class="sub">なら作らない</text>
  <rect x="850" y="280" width="170" height="76" rx="10" class="card" style=""/>
  <svg x="866" y="294" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--gray)"><path d="M5 21.5V3.5M5 4h12l-2.5 4L17 12H5"/></svg>
  <text x="902" y="312" class="title">飛ばす</text>
  <text x="866" y="340" class="sub">監視を終える</text>
  <rect x="850" y="380" width="170" height="76" rx="10" class="card" style=""/>
  <svg x="866" y="394" width="26" height="26" viewBox="0 0 24 24" class="icon" style="stroke:var(--amber)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
  <text x="902" y="412" class="title">時間切れ</text>
  <text x="866" y="440" class="sub">監視を終える</text>
  <rect x="437.8" y="56" width="44.5" height="18" rx="4" class="label-bg"/>
  <text x="460" y="69" class="label" text-anchor="middle">通った</text>
  <rect x="792" y="39" width="56" height="18" rx="4" class="label-bg"/>
  <text x="820" y="52" class="label" text-anchor="middle">問題なし</text>
  <rect x="780.5" y="113" width="79" height="18" rx="4" class="label-bg"/>
  <text x="820" y="126" class="label" text-anchor="middle">失敗・エラー</text>
  <rect x="659" y="249" width="79" height="18" rx="4" class="label-bg"/>
  <text x="738" y="262" class="label" text-anchor="end">判断できない</text>
  <rect x="583.5" y="179" width="33" height="18" rx="4" class="label-bg"/>
  <text x="600" y="192" class="label" text-anchor="middle">失敗</text>
  <rect x="551.2" y="209" width="97.6" height="18" rx="4" class="label-bg"/>
  <text x="600" y="222" class="label" text-anchor="middle">5分たっても無い</text>
  <rect x="547.6" y="399" width="104.8" height="18" rx="4" class="label-bg"/>
  <text x="600" y="412" class="label" text-anchor="middle">60分で終わらない</text>
  <text x="20" y="300" class="sub">どの結果でも、監視が終わると</text>
  <text x="20" y="322" class="sub">タスクは完了します。</text>
</svg>
