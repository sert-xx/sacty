<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 290" width="1120" height="290" role="img" aria-labelledby="title desc">
  <!-- scripts/docs-diagrams で作ったファイル。直すときは定義（scripts/docs-diagrams/diagrams/intro-flow.mjs）を直して npm run docs:diagrams で作り直す -->
  <title id="title">From a request to a merged PR</title>
  <desc id="desc">You make a request from an issue, JIRA, or the web UI. sacty's AI agents gather the related information, choose how to proceed, do the work, fix it through AI review, and open a PR. You approve by merging the PR, or send it back with a comment.</desc>
  <style>
    svg { --text:#1f2328; --sub:#59636e; --card:#ffffff; --line:#d1d9e0; --arrow:#6e7781; --code-bg:#eff2f5;
          --blue:#0969da; --blue-bg:#ddf4ff; --blue-line:#54aeff;
          --green:#1a7f37; --green-bg:#dafbe1; --green-line:#4ac26b;
          --gray:#59636e; --gray-bg:#f6f8fa; --gray-line:#d1d9e0;
          --amber:#9a6700; --amber-bg:#fff8c5; --amber-line:#d4a72c;
          --purple:#8250df; --purple-bg:#fbefff; --purple-line:#c297ff;
          --red:#cf222e; --red-bg:#ffebe9; --red-line:#ff8182; }
    @media (prefers-color-scheme: dark) {
      svg { --text:#e6edf3; --sub:#9198a1; --card:#151b23; --line:#3d444d; --arrow:#9198a1; --code-bg:#262c36;
            --blue:#4493f8; --blue-bg:#0d2a4a; --blue-line:#1f6feb;
            --green:#3fb950; --green-bg:#0f2d1a; --green-line:#238636;
            --gray:#9198a1; --gray-bg:#10151c; --gray-line:#3d444d;
            --amber:#d29922; --amber-bg:#2e2410; --amber-line:#9e6a03;
            --purple:#ab7df8; --purple-bg:#271a3f; --purple-line:#8957e5;
            --red:#f85149; --red-bg:#3a1418; --red-line:#da3633; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "IPAGothic", sans-serif; fill: var(--text); }
    .zone { font-size: 13px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--sub); }
    .strong { font-size: 12.5px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .label { font-size: 11.5px; fill: var(--sub); }
    .card { fill: var(--card); stroke: var(--line); }
    .pill { fill: var(--code-bg); }
    .label-bg { fill: var(--card); opacity: .92; }
    .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .muted { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .lifeline { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--arrow)"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--blue)"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--green)"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--gray)"/></marker>
    <marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--amber)"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--purple)"/></marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--red)"/></marker>
  </defs>
  <rect x="10" y="20" width="180" height="200" rx="14" style="fill:var(--purple-bg);stroke:var(--purple-line)"/>
  <text x="30" y="46" class="zone" style="fill:var(--purple)">You</text>
  <rect x="194" y="20" width="732" height="200" rx="14" style="fill:var(--blue-bg);stroke:var(--blue-line)"/>
  <text x="214" y="46" class="zone" style="fill:var(--blue)">sacty (AI agents do the work)</text>
  <rect x="930" y="20" width="180" height="200" rx="14" style="fill:var(--purple-bg);stroke:var(--purple-line)"/>
  <text x="950" y="46" class="zone" style="fill:var(--purple)">You</text>
  <path d="M180 132 L204 132" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M364 132 L388 132" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M548 132 L572 132" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M732 132 L756 132" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M916 132 L940 132" class="flow" style="" marker-end="url(#ah-arrow)"/>
  <path d="M1020 202 L1020 246 Q1020 256 1010 256 L662 256 Q652 256 652 246 L652 202" class="muted" style="" marker-end="url(#ah-arrow)"/>
  <rect x="20" y="62" width="160" height="140" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="36" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4 3.8-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg>
  <text x="72" y="94" class="title">Request</text>
  <text x="36" y="122" class="sub">Write what you</text>
  <text x="36" y="142" class="sub">want, in an issue,</text>
  <text x="36" y="162" class="sub">JIRA, or the UI</text>
  <rect x="204" y="62" width="160" height="140" rx="10" class="card" style=""/>
  <svg x="220" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
  <text x="256" y="94" class="title">Research</text>
  <text x="220" y="122" class="sub">Reads tickets,</text>
  <text x="220" y="142" class="sub">code, and docs</text>
  <text x="220" y="162" class="sub">for the context</text>
  <rect x="388" y="62" width="160" height="140" rx="10" class="card" style=""/>
  <svg x="404" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></svg>
  <text x="440" y="94" class="title">Plan</text>
  <text x="404" y="122" class="sub">Chooses the steps</text>
  <text x="404" y="142" class="sub">that fit the work</text>
  <rect x="572" y="62" width="160" height="140" rx="10" class="card" style=""/>
  <svg x="588" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="M3.5 7 12 11.5 20.5 7M12 11.5v10"/></svg>
  <text x="624" y="94" class="title">Build</text>
  <text x="588" y="122" class="sub">Requirements,</text>
  <text x="588" y="142" class="sub">design, code,</text>
  <text x="588" y="162" class="sub">and tests</text>
  <rect x="756" y="62" width="160" height="140" rx="10" class="card" style=""/>
  <svg x="772" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--blue)"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.8 2.8 5.2-5.6"/></svg>
  <text x="808" y="94" class="title">Review</text>
  <text x="772" y="122" class="sub">AI reviews the PR</text>
  <text x="772" y="142" class="sub">and fixes it until</text>
  <text x="772" y="162" class="sub">nothing is left</text>
  <text x="772" y="182" class="sub"></text>
  <rect x="940" y="62" width="160" height="140" rx="10" class="card" style="stroke:var(--purple);stroke-width:1.5"/>
  <svg x="956" y="76" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" class="icon" style="stroke:var(--purple)"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M6 7.2v9.6M6 7.2c0 5 4 7.8 9.8 7.8"/></svg>
  <text x="992" y="94" class="title">Approve</text>
  <text x="956" y="122" class="sub">Merge the PR</text>
  <text x="956" y="142" class="sub">and you're done</text>
  <rect x="717.8" y="248" width="236.3" height="18" rx="4" class="label-bg"/>
  <text x="836" y="261" class="label" text-anchor="middle">Send it back with a comment, and it is fixed</text>
</svg>
